<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-3xl mb-2">⚡</div>
      <h1 class="text-white text-xl font-semibold">Painel Admin</h1>
      <p class="text-gray-500 text-sm mt-1">Acesso restrito</p>
    </div>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800">
      {% if error %}
      <div class="bg-red-900/40 border border-red-700 text-red-300 rounded-lg px-4 py-3 text-sm mb-6">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/admin/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Usuário</label>
          <input type="text" name="username" required autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Senha</label>
          <input type="password" name="password" required
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"/>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
          Entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
