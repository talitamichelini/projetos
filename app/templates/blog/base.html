<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Blog{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-serif { font-family: 'Lora', serif; }
    .prose h2 { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 600; margin: 2rem 0 1rem; }
    .prose h3 { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 600; margin: 1.5rem 0 0.75rem; }
    .prose p { margin-bottom: 1.25rem; line-height: 1.8; }
    .prose ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .prose ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .prose li { margin-bottom: 0.4rem; }
    .prose pre { background: #1e1e2e; color: #cdd6f4; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.25rem; }
    .prose code { font-size: 0.875rem; }
    .prose blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; color: #6b7280; font-style: italic; margin: 1.5rem 0; }
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
    .prose th, .prose td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; }
    .prose th { background: #f3f4f6; }
  </style>
</head>
<body class="bg-stone-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="font-serif text-xl font-semibold text-indigo-700 hover:text-indigo-900 transition">✍️ Meu Blog</a>
      <div class="flex gap-6 text-sm text-gray-500">
        <a href="/" class="hover:text-indigo-600 transition">Posts</a>
        <a href="/admin" class="hover:text-indigo-600 transition">Admin</a>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-stone-200 bg-white mt-16">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
      Feito com FastAPI + Jinja2 🐍
    </div>
  </footer>
</body>
</html>
