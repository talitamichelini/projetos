
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas tarefas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 20px;
            background: #f4f6f4;
            color: #26352d;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 850px;
            margin: auto;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            margin-bottom: 8px;
            color: #0F5132;
        }

        .subtitulo {
            color: #68756d;
        }

        .tarefa {
            background: white;
            border: 1px solid #e2e8e3;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
        }
.status-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0;
    margin-top: 0;
    background: transparent;
    color: #26352d;
    font-size: 14px;
    border: none;
}

.trilho {
    width: 52px;
    height: 28px;
    border-radius: 20px;
    position: relative;
    transition: background 0.2s;
}

.status-toggle.andamento .trilho {
    background: #e9bd45;
}

.status-toggle.concluido .trilho {
    background: #198754;
}

.trilho::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    top: 3px;
    left: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
}

.status-toggle.concluido .trilho::before {
    transform: translateX(24px);
}
        .tarefa h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        .detalhe {
            color: #68756d;
            font-size: 14px;
            margin: 6px 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5ded7;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            min-height: 75px;
            resize: vertical;
        }

        button {
            margin-top: 14px;
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            background: #0F5132;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .vazio {
            background: white;
            padding: 24px;
            border-radius: 12px;
            color: #68756d;
        }
    </style>
</head>

<body>
<main>
    <header>
        <h1>Olá, {{ nome }}!</h1>
        <p class="subtitulo">Acompanhe suas entregas e atualize suas tarefas.</p>
    </header>

    <section id="lista-tarefas">
        Carregando tarefas...
    </section>
</main>

<script>
    const token = {{ token | tojson }};

    async function carregarTarefas() {
        const resposta = await fetch(
            `/api/profissional/${token}/tarefas`
        );

        const dados = await resposta.json();
        const lista = document.getElementById("lista-tarefas");

        if (!resposta.ok) {
            lista.textContent = dados.erro || "Não foi possível carregar as tarefas.";
            return;
        }

        if (!dados.tarefas.length) {
            lista.innerHTML = '<div class="vazio">Você não possui tarefas cadastradas.</div>';
            return;
        }

        lista.innerHTML = dados.tarefas.map(tarefa => `
            <article class="tarefa">
                <h2>${escapar(tarefa.titulo)}</h2>

                <p class="detalhe">
                    Cliente: ${escapar(tarefa.conta_nome)}
                </p>

                <p class="detalhe">
                    Serviço: ${escapar(tarefa.servico_nome || "—")}
                </p>

                <p class="detalhe">
                    Prazo: ${formatarPrazo(tarefa.prazo)}
                </p>

                <label>Status</label>

<button
    type="button"
    id="status-${tarefa.id}"
    class="status-toggle ${tarefa.status}"
    onclick="alternarStatus(${tarefa.id})"
>
    <span class="trilho"></span>
<span>${tarefa.status === "concluido" ? "Concluído" : "Em andamento"}</span>
</button>

                <label for="obs-${tarefa.id}">Observação</label>
                <textarea id="obs-${tarefa.id}">${escapar(tarefa.observacao || "")}</textarea>

                <button onclick="salvarTarefa(${tarefa.id})">
                    Salvar atualização
                </button>
            </article>
        `).join("");
    }

function alternarStatus(id) {
    const botao = document.getElementById(`status-${id}`);
    const concluido = botao.classList.contains("concluido");

    botao.classList.toggle("concluido", !concluido);
    botao.classList.toggle("andamento", concluido);

    botao.innerHTML = `
    <span class="trilho"></span>
    <span>${concluido ? "Em andamento" : "Concluído"}</span>
`;
}

    async function salvarTarefa(id) {
        const botaoStatus = document.getElementById(`status-${id}`);
const status = botaoStatus.classList.contains("concluido")
    ? "concluido"
    : "andamento";
        const observacao = document.getElementById(`obs-${id}`).value;

        const resposta = await fetch(
            `/api/profissional/${token}/tarefas/${id}`,
            {
                method: "PATCH",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({status, observacao})
            }
        );

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro || "Não foi possível salvar.");
            return;
        }

        alert("Atualização salva com sucesso!");
        carregarTarefas();
    }

    function escapar(valor) {
        return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[caractere]);
    }

    function formatarPrazo(valor) {
        const data = new Date(valor);
        return Number.isNaN(data.getTime())
            ? valor
            : data.toLocaleString("pt-BR");
    }

    carregarTarefas();
</script>
</body>
</html>
