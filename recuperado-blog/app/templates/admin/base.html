<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col min-h-screen fixed top-0 left-0">
    <div class="px-5 py-6 border-b border-gray-800">
      <span class="text-white font-semibold text-sm">⚡ Painel Admin</span>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="/admin" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">
        📊 Dashboard
      </a>
      <a href="/admin/posts/new" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">
        ✍️ Novo Post
      </a>
      <a href="/" target="_blank" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition">
        🌐 Ver Blog
      </a>
    </nav>
    <div class="p-4 border-t border-gray-800">
      <a href="/admin/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-red-400 transition">
        🚪 Sair
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 ml-56">
    <header class="bg-gray-900 border-b border-gray-800 px-8 py-4">
      <h1 class="text-sm font-medium text-gray-300">{% block header %}Admin{% endblock %}</h1>
    </header>
    <main class="p-8">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
