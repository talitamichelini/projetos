<!DOCTYPE html>
<html>
<head>
  <title>Convite de Páscoa 🐣</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffe4ec, #fff6cc);
      text-align: center;
      padding-top: 50px;
    }

    h1 {
      color: #d63384;
    }

    /* TELA INICIAL */
    #telaInicial {
      margin-top: 50px;
    }

    #nomeInput {
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 200px;
    }

    #telaInicial button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background-color: #d63384;
      color: white;
      cursor: pointer;
    }

    #telaInicial button:hover {
      background-color: #ad2167;
    }

    .container {
      margin-top: 30px;
    }

    .ovo {
      font-size: 40px;
      padding: 20px;
      margin: 10px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .ovo:hover {
      transform: scale(1.1);
      background-color: #ffe4ec;
    }

    #mensagem {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
    }

    #convite {
      display: none;
      margin: 30px auto;
      width: 300px;
      padding: 20px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      animation: aparecer 0.6s ease-in-out;
    }

    @keyframes aparecer {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-5deg);
      }
      60% {
        transform: scale(1.1) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .botao-reiniciar {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #d63384;
      color: white;
    }

    .botao-reiniciar:hover {
      background-color: #ad2167;
    }
  </style>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body>

<h1>🐰 Jogo do Coelhinho</h1>

<!-- TELA INICIAL -->
<div id="telaInicial">
  <h2>Bem-vindo! 🐣</h2>
  <p>O coelhinho escondeu um convite especial…</p>

  <input type="text" id="nomeInput" placeholder="Digite seu nome" />
  <br><br>
  <button onclick="comecarJogo()">Começar 🥚</button>
</div>

<p id="mensagem"></p>

<div class="container" id="ovosContainer"></div>

<div id="convite">
  <h2>🎉 Você encontrou!</h2>
  <p id="textoConvite"></p>
  <button class="botao-reiniciar" onclick="reiniciar()">Jogar novamente 🔄</button>
</div>

<script>
  let nome = "";
  let mensagem = document.getElementById("mensagem");
  let convite = document.getElementById("convite");
  let textoConvite = document.getElementById("textoConvite");
  let container = document.getElementById("ovosContainer");

  let tentativas;
  let ovos;

  function comecarJogo() {
    let input = document.getElementById("nomeInput");
    nome = input.value;

    if (nome === "") {
      alert("Digite seu nome primeiro 😊");
      return;
    }

    document.getElementById("telaInicial").style.display = "none";
    iniciarJogo();
  }

  function iniciarJogo() {
    tentativas = 0;
    convite.style.display = "none";
    container.innerHTML = "";

    mensagem.innerText = "Olá " + nome + "! Encontre o convite escondido 🥚";

    ovos = [false, false, false, false, false, false];

    let premio = Math.floor(Math.random() * ovos.length);
    ovos[premio] = true;

    ovos.forEach((_, index) => {
      let botao = document.createElement("button");
      botao.className = "ovo";
      botao.innerText = "🥚";

      botao.onclick = function () {
        escolherOvo(index, botao);
      };

      container.appendChild(botao);
    });
  }

  function escolherOvo(index, botao) {
    if (botao.disabled) return;

    tentativas++;
    botao.disabled = true;

    if (ovos[index]) {
      botao.innerText = "🎉";

      mensagem.innerText =
        "🎉 Parabéns " + nome + "! Você encontrou em " + tentativas + " tentativas!";

      convite.style.display = "block";

      textoConvite.innerText =
        nome + ", você está convidado para Páscoa na minha casa! 🐣\n\n📅 03/04\n📍 Araripe Junior, 120\n⏰ 12h";

      soltarConfete();
    } else {
      botao.innerText = "❌";
      mensagem.innerText = "Ops! Ovo vazio 😅 Tentativas: " + tentativas;
    }
  }

  function soltarConfete() {
    let duration = 2 * 1000;
    let end = Date.now() + duration;

    (function frame() {
      confetti({
        particleCount: 5,
        angle: 60,
        spread: 55,
        origin: { x: 0 },
      });
      confetti({
        particleCount: 5,
        angle: 120,
        spread: 55,
        origin: { x: 1 },
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    })();
  }

  function reiniciar() {
    iniciarJogo();
  }
</script>

</body>
</html>
